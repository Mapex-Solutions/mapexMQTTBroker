# =============================================================================
# Mapex MQTT Broker — Smoke test stack
#
# Minimal stack: NATS + MinIO + broker. No toolbox containers — the
# run.sh script uses `docker run --rm` for one-shot operations.
#
# Usage:
#   cd tests/smoke
#   docker compose up -d
#   ./run.sh
#   docker compose down -v
# =============================================================================

services:
  nats:
    image: nats:2.12-alpine
    container_name: mapex-smoke-nats
    command: ["-DV", "-m", "8222"]
    ports:
      - "${SMOKE_NATS_PORT:-14222}:4222"
    networks:
      - smoke
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: mapex-smoke-minio
    command: server /data --console-address ":9001"
    ports:
      - "${SMOKE_MINIO_API_PORT:-19000}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mapex-smoke-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mapex-smoke-password-1234}
    networks:
      - smoke
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: mapex-smoke-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - smoke
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mapex-smoke-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mapex-smoke-password-1234}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set mapex http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
        mc mb mapex/mapex-mqtt-auth --ignore-existing
        echo "=== Smoke MinIO init complete ==="

  broker:
    image: ${BROKER_IMAGE:-thiagoanselmo/mapex-broker-mqtt:dev}
    container_name: mapex-smoke-broker
    depends_on:
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${SMOKE_BROKER_PORT:-11883}:1883"
    environment:
      INTERNAL_API_KEY: smoke-test-internal-api-key
      NATS_URL: nats://nats:4222
      ASSETS_HOST: assets-not-running
      ASSETS_PORT: "5002"
      CACHE_L1_PATH: /var/cache/mqtt
      CACHE_L1_TTL_MINUTES: "30"
      CACHE_L2_ENDPOINT: minio:9000
      CACHE_L2_ACCESS_KEY: ${MINIO_ROOT_USER:-mapex-smoke-admin}
      CACHE_L2_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mapex-smoke-password-1234}
      CACHE_L2_BUCKET: mapex-mqtt-auth
      CACHE_L2_USE_SSL: "false"
      FANOUT_INVALIDATE_SUBJECT: mapexos.fanout.asset.invalidate
    networks:
      - smoke
    volumes:
      - broker-cache:/var/cache/mqtt

networks:
  smoke:
    name: mapex-smoke

volumes:
  minio-data:
  broker-cache:
